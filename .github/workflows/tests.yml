name: Tests

on:
  push:
    branches: [main, imports]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        # The umap extra is needed as well as testing: without umap-learn the
        # whole TopographyUMAP suite skips, so the run goes green having never
        # exercised it.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[testing,umap]'

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: test-fixtures

      - name: Run pytest
        run: pytest tests/ -v --tb=short
